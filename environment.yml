name: svg-agentic-slm
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    - torch>=2.0
    - transformers>=4.40
    - peft>=0.10
    - trl>=0.8
    - datasets>=2.18
    - accelerate>=0.28
    - bitsandbytes>=0.43
    - huggingface-hub==0.34.4
    # Install llama-cpp-python==0.3.34 separately with GGML_CUDA enabled.
    - chromadb>=0.4
    - cairosvg>=2.7
    - typer>=0.12
    - rich>=13.0
    - pydantic>=2.0
    - pyyaml>=6.0
    - python-dotenv>=1.0
    - Pillow>=10.0
    - lxml>=5.0
    - pytest>=8.0
    - pytest-cov>=5.0
