# RAG configuration
rag:
  # Default backend. CLI override: --rag-backend chromadb|qdrant
  backend: "chromadb"
  # Backend-specific settings below override these legacy shared defaults.
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  top_k: 3
  similarity_threshold: 0.5

  chromadb:
    collection_name: "mmsvg_description_qwen3_0_6b_1024_v1"
    persist_directory: "./data/chroma_db"
    embedding_model: "Qwen/Qwen3-Embedding-0.6B"
    embedding_revision: "97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3"
    embedding_dimension: 1024
    precomputed_embeddings: true
    device: "cuda:0"
    overfetch_factor: 5
    similarity_threshold: 0.0
    query_instruction: >-
      Given a user description of a desired SVG image, retrieve SVG examples
      matching the objects, attributes, colors, style, composition, and spatial
      relationships.
    dataset_roots:
      icon: "./data/raw/mmsvg_icon_v2/data"
      illustration: "./data/raw/mmsvg_illustration_v2/data"

  # Credentials are read only from these environment-variable names.
  qdrant:
    collection_name: "svg_text2svg_stack_minilm384_v1"
    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
    similarity_threshold: 0.5
    url_env: "QDRANT_URL"
    api_key_env: "QDRANT_API_KEY"
    timeout_seconds: 120
    upload_batch_size: 64

    # Storage-oriented settings for a small Qdrant Cloud/self-hosted cluster.
    compress_svg: true
    on_disk_vectors: true
    on_disk_payload: true
    on_disk_hnsw: true
    scalar_quantization: true
    optimize_existing_collection: true

  # Used only by `svg-agentic-slm rag-index`.
  indexing:
    dataset_id: "starvector/text2svg-stack"
    dataset_split: "train"
    # Pinned for reproducible indexing; update deliberately when changing corpora.
    dataset_revision: "c6f2bf0fffd8c1b69fcf748c97f4b0e7de6f2687"

    # This is a safe starting target, not a universal Qdrant maximum.
    # Increase with `rag-index --limit N` while monitoring cluster disk/RAM.
    index_limit: 100000
    batch_size: 64
    max_svg_chars: 24000
    max_caption_chars: 1200
    shuffle_buffer: 2000
    seed: 42
