# A100 80GB PCIe profile for image-grounded Qwen2.5-VL Critic SFT.
# The JSONL paths intentionally remain explicit: run --validate-only before training.
train:
  model:
    model_id: "Qwen/Qwen2.5-VL-3B-Instruct"
    revision: "66285546d2b821cf421d4f5eb2576359d3770cd3"
    auto_model_class: "image_text_to_text"
    dtype: "bfloat16"
    attn_implementation: "sdpa"
    load_in_4bit: false
    local_files_only: false
    trust_remote_code: false

  critic:
    score_threshold: 3.0

  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
    bias: "none"
    task_type: "CAUSAL_LM"

  sft:
    output_dir: "./outputs/sft/qwen2_5_vl_3b_critic_a100"
    num_train_epochs: 3.0
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 2
    gradient_accumulation_steps: 8
    learning_rate: 2.0e-4
    weight_decay: 0.01
    warmup_ratio: 0.03
    lr_scheduler_type: "cosine"
    logging_steps: 10
    logging_nan_inf_filter: false
    save_steps: 100
    eval_steps: 100
    save_total_limit: 2
    eval_strategy: "epoch"
    save_strategy: "epoch"
    load_best_model_at_end: true
    metric_for_best_model: "eval_loss"
    greater_is_better: false
    prediction_loss_only: true
    do_train: true
    do_eval: true
    do_predict: false
    early_stopping_patience: 2
    early_stopping_threshold: 0.01
    max_seq_length: 8192
    bf16: true
    fp16: false
    tf32: true
    float32_matmul_precision: "high"
    gradient_checkpointing: false
    optim: "adamw_torch_fused"
    torch_compile: false
    seed: 42
    dataloader_num_workers: 4
    dataloader_pin_memory: true
    dataloader_non_blocking: true
    dataloader_persistent_workers: true
    dataloader_prefetch_factor: 4
    # Keep every validation sample; HF applies this flag to eval loaders too.
    dataloader_drop_last: false
    ddp_backend: "nccl"
    ddp_bucket_cap_mb: 100
    ddp_broadcast_buffers: false
    # Required for gradient accumulation/no_sync compatibility on PyTorch 2.6.
    ddp_static_graph: false
    include_num_input_tokens_seen: true
    tokenized_cache: false
    collator_array_fast_path: false
    resume_from_checkpoint: null
    rehydrate_paged_optimizer_state_on_resume: false
    merge_adapter: false
    report_to: []
    chunked_lm_head_loss: true

  dataset:
    train_path: "./data/processed/critic_sft/train.jsonl"
    validation_path: "./data/processed/critic_sft/validation.jsonl"
