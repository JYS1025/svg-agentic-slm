# R2: same split/target as R0, detail-only instruction ablation.
train:
  model:
    model_id: "google/gemma-4-12B-it-qat-q4_0-unquantized"
    revision: "b6ed86275a6a5735884e208bfed95b445a684ca2"
    auto_model_class: "multimodal_lm"
    dtype: "bfloat16"
    attn_implementation: "sdpa"
    load_in_4bit: true
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_use_double_quant: true
    local_files_only: false
    trust_remote_code: false
  experiment:
    instruction_mode: "detail_only"
    target_representation: "raw_xml"
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
    bias: "none"
    task_type: "CAUSAL_LM"
  sft:
    output_dir: "./outputs/sft/gemma4_raw_detail"
    num_train_epochs: 1.0
    per_device_train_batch_size: 1
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 16
    learning_rate: 2.0e-4
    weight_decay: 0.01
    warmup_ratio: 0.03
    lr_scheduler_type: "cosine"
    logging_steps: 10
    save_steps: 100
    eval_steps: 100
    save_total_limit: 2
    max_seq_length: 8192
    bf16: true
    gradient_checkpointing: true
    optim: "paged_adamw_8bit"
    seed: 42
    merge_adapter: false
  dataset:
    train_path: "./data/processed/mmsvg_sft_20k/train.jsonl"
    validation_path: "./data/processed/mmsvg_sft_20k/validation.jsonl"
