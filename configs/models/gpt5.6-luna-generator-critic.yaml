# Remote GPT-5.6 Luna upper-bound profile for Generator and visual Critic.
model:
  backend_type: "openai_compatible"
  base_url: "https://api.bizrouter.ai/v1"
  model_id: "openai/gpt-5.6-luna"
  engine: "responses"
  api_key_env: "BIZROUTER_API_KEY"
  timeout_seconds: 300
  max_retries: 1
  reasoning_effort: "medium"

critic_model:
  backend_type: "openai_compatible"
  base_url: "https://api.bizrouter.ai/v1"
  model_id: "openai/gpt-5.6-luna"
  engine: "responses"
  api_key_env: "BIZROUTER_API_KEY"
  timeout_seconds: 300
  max_retries: 1
  reasoning_effort: "medium"
  max_new_tokens: 6000
  render_width: 512
  render_height: 512
  background_color: "#ffffff"

# Preserve the auxiliary evidence path used by run_simple_bench.sh.
similarity_model:
  backend_type: "siglip2"
  model_id: "google/siglip2-base-patch16-224"
  revision: "75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2"
  device: "cuda:1"
  dtype: "bfloat16"
  attn_implementation: "sdpa"
  local_files_only: true
  trust_remote_code: false
  text_template: "This is a photo of {instruction}."
