# Gemma 4 text-to-SVG Generator with a dedicated Qwen3.5-4B visual Critic.
model:
  backend_type: "llama_cpp"
  model_id: "lmstudio-community/gemma-4-12B-it-QAT-GGUF"
  filename: "gemma-4-12B-it-QAT-Q4_0.gguf"
  revision: "291406f49e16eff811c85ad8884d375f34138663"
  upstream_model_id: "google/gemma-4-12B-it-qat-q4_0-unquantized"
  quantization: "Q4_0"
  quantization_provider: "LM Studio Community"
  conversion_runtime: "llama.cpp b9518"
  n_gpu_layers: -1
  main_gpu: 0
  split_mode: "none"
  n_ctx: 8192
  n_batch: 512
  flash_attn: true
  use_mmap: true
  verbose: false
  chat_format: null
  measure_streaming_metrics: true

critic_model:
  backend_type: "transformers_vlm"
  model_id: "Qwen/Qwen3.5-4B"
  revision: "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a"
  device: "cuda:1"
  dtype: "bfloat16"
  attn_implementation: "sdpa"
  auto_model_class: "multimodal_lm"
  enable_thinking: false
  max_new_tokens: 2048
  do_sample: false
  local_files_only: true
  trust_remote_code: false
  # Set these after SFT. The backend keeps the same generate_with_image contract.
  adapter_path: null
  processor_path: null
  load_in_4bit: false
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  render_width: 512
  render_height: 512
  background_color: "#ffffff"

# Optional auxiliary image-text evidence for critic_v1.
similarity_model:
  backend_type: "siglip2"
  model_id: "google/siglip2-base-patch16-224"
  revision: "75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2"
  device: "cuda:1"
  dtype: "bfloat16"
  attn_implementation: "sdpa"
  local_files_only: false
  trust_remote_code: false
  text_template: "This is a photo of {instruction}."
