# Copy this profile and replace the immutable model identity for each experiment.
model:
  backend_type: "openai_compatible"
  base_url: "http://127.0.0.1:8000/v1"
  model_id: "svg-generator-model@revision"
  revision: "immutable-revision"
  engine: "vllm"  # Options: vllm, llama_cpp
  api_key_env: "MODEL_API_KEY"
  timeout_seconds: 120
  max_retries: 0
  allow_insecure_http: false
