# Isolated OmniSVG-inspired discrete-token ablation. The adapter, tokenizer,
# and manifest must come from the same training run; inference fails closed on
# any codec vocabulary or token-ID mismatch.
model:
  backend_type: "transformers_text"
  model_id: "google/gemma-4-12B-it-qat-q4_0-unquantized"
  revision: "b6ed86275a6a5735884e208bfed95b445a684ca2"
  adapter_path: "outputs/sft/gemma4_discrete/adapter"
  tokenizer_path: "outputs/sft/gemma4_discrete/tokenizer"
  output_format: "discrete_svg"
  codec_manifest_path: "outputs/sft/gemma4_discrete/codec_manifest.json"
  codec_grid_size: 200
  auto_model_class: "multimodal_lm"
  device: "cuda:0"
  dtype: "bfloat16"
  attn_implementation: "sdpa"
  enable_thinking: false
  local_files_only: false
  trust_remote_code: false

critic_model:
  backend_type: "transformers_vlm"
  model_id: "google/gemma-4-12B-it-qat-q4_0-unquantized"
  revision: "b6ed86275a6a5735884e208bfed95b445a684ca2"
  auto_model_class: "multimodal_lm"
  device: "cuda:1"
  dtype: "bfloat16"
  attn_implementation: "sdpa"
  max_new_tokens: 384
  do_sample: false
  enable_thinking: false
  local_files_only: false
  trust_remote_code: false
  render_width: 512
  render_height: 512
  background_color: "#ffffff"
