# R0 baseline: description-only instruction and raw SVG XML target.
train:
  model:
    model_id: "google/gemma-4-12B-it-qat-q4_0-unquantized"
    revision: "b6ed86275a6a5735884e208bfed95b445a684ca2"
    auto_model_class: "multimodal_lm"
    dtype: "bfloat16"
    attn_implementation: "sdpa"
    load_in_4bit: true
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_use_double_quant: true
    local_files_only: false
    trust_remote_code: false
    token_env: null

  experiment:
    instruction_mode: "description_only"
    target_representation: "raw_xml"

  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
    bias: "none"
    task_type: "CAUSAL_LM"
    modules_to_save: []

  sft:
    output_dir: "./outputs/sft/gemma4_raw"
    num_train_epochs: 5.0
    per_device_train_batch_size: 1
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 16
    train_sampling_strategy: "group_by_length"
    length_grouping_batch_size: 16
    learning_rate: 2.0e-4
    weight_decay: 0.01
    warmup_ratio: 0.03
    lr_scheduler_type: "cosine"
    logging_steps: 10
    save_steps: 100
    eval_steps: 100
    save_total_limit: 2
    eval_strategy: "epoch"
    save_strategy: "epoch"
    load_best_model_at_end: true
    metric_for_best_model: "eval_loss"
    greater_is_better: false
    prediction_loss_only: true
    early_stopping_patience: 2
    early_stopping_threshold: 0.01
    max_seq_length: 8192
    bf16: true
    fp16: false
    gradient_checkpointing: true
    optim: "paged_adamw_8bit"
    seed: 42
    dataloader_num_workers: 2
    resume_from_checkpoint: null
    rehydrate_paged_optimizer_state_on_resume: true
    merge_adapter: false
    report_to: []
    chunked_lm_head_loss: true
    lm_head_loss_chunk_size: 256

  dataset:
    train_path: "./data/processed/mmsvg_sft_20k/train.jsonl"
    validation_path: "./data/processed/mmsvg_sft_20k/validation.jsonl"
    test_path: "./data/processed/mmsvg_sft_20k/test.jsonl"
